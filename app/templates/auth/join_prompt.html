{% extends "base.html" %}
{% block title %}Join Organization{% endblock %}

{% block content %}
<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-icon"><svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-link-2"><path d="M9 17H7A5 5 0 0 1 7 7h2"/><path d="M15 7h2a5 5 0 0 1 0 10h-2"/><line x1="8" y1="12" x2="16" y2="12"/></svg></div>
      <h1 class="auth-title">Join an Organization</h1>
      <p class="auth-subtitle">Have a join URL or a code? Paste it below to join your organization.</p>
    </div>
    
    <form method="POST" action="{{ url_for('auth.join_prompt') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
      
      <div class="form-group">
        <label class="form-label" for="code">Join Code or Link</label>
        <input class="form-input" type="text" id="code" name="code" required placeholder="e.g. 8fH3k..." />
      </div>
      
      <div class="form-actions mt-4">
        <button type="submit" class="btn btn-primary btn-block">Join Organization</button>
      </div>
    </form>
    
    <p class="auth-footer-note">
      <a href="{{ url_for('index') }}" class="link-subtle">Cancel</a>
    </p>
  </div>
</div>
{% endblock %}
