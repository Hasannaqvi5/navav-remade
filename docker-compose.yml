version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: muster_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: muster
      POSTGRES_PASSWORD: muster
      POSTGRES_DB: muster
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
