{% extends "base.html" %}
{% block title %}Edit Event — {{ event.name }}{% endblock %}
{% block content %}
<div class="page-container page-narrow">
  <div class="page-header">
    <h1 class="page-title">Edit Event</h1>
    <p class="page-subtitle">{{ unit.name }}</p>
  </div>
  <div class="card">
    <form method="POST" action="{{ url_for('admin.edit_event', unit_id=unit.id, event_id=event.id) }}">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
      <div class="form-group">
        <label class="form-label" for="name">Event Name</label>
        <input class="form-input" type="text" id="name" name="name" required value="{{ event.name }}" />
      </div>
      <div class="form-row-2">
        <div class="form-group">
          <label class="form-label" for="event_date">Date</label>
          <input class="form-input" type="date" id="event_date" name="event_date" required value="{{ event.event_date.strftime('%Y-%m-%d') }}" />
        </div>
        <div class="form-group">
          <label class="form-label">Time <span class="form-hint">(optional)</span></label>
          <div style="display: flex; align-items: center; gap: 0.5rem;">
            <input class="form-input" type="time" id="event_time" name="event_time" title="Start Time" value="{{ event.event_time.strftime('%H:%M') if event.event_time else '' }}" />
            <span>—</span>
            <input class="form-input" type="time" id="event_end_time" name="event_end_time" title="End Time" value="{{ event.event_end_time.strftime('%H:%M') if event.event_end_time else '' }}" />
          </div>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label" for="location">Location <span class="form-hint">(optional)</span></label>
        <input class="form-input" type="text" id="location" name="location" value="{{ event.location or '' }}" />
      </div>
      <div class="form-group">
        <label class="form-label" for="description">What's Happening <span class="form-hint">(optional)</span></label>
        <textarea class="form-input form-textarea" id="description" name="description" rows="3">{{ event.description or '' }}</textarea>
      </div>
      <div class="form-group">
        <label class="form-label" for="response_due_date">Response Due Date &amp; Time <span class="form-hint">(optional)</span></label>
        <input class="form-input" type="datetime-local" id="response_due_date" name="response_due_date" value="{{ event.response_due_date.strftime('%Y-%m-%dT%H:%M') if event.response_due_date else '' }}" />
      </div>

      <script>
        document.addEventListener('DOMContentLoaded', function() {
          const eventDate = document.getElementById('event_date');
          const eventTime = document.getElementById('event_time');
          const dueInput = document.getElementById('response_due_date');

          function updateMaxDue() {
            if (eventDate.value) {
              const time = eventTime.value || '00:00';
              dueInput.max = `${eventDate.value}T${time}`;
            }
          }

          eventDate.addEventListener('change', updateMaxDue);
          eventTime.addEventListener('change', updateMaxDue);
          updateMaxDue();
        });
      </script>
      <div class="form-actions" style="display: flex; justify-content: space-between; align-items: center;">
        <div>
          <button type="submit" class="btn btn-primary">Save Changes</button>
          <a href="{{ url_for('admin.events', unit_id=unit.id) }}" class="btn btn-ghost">Cancel</a>
        </div>
        <button type="button" class="btn text-danger" style="background:none; border:none; cursor:pointer;" title="Delete Event" onclick="if(confirm('Are you sure you want to completely delete this event? This will also wipe all attendee RSVPs and attendance records.')) document.getElementById('delete-event-form').submit();">
          🗑️ Delete Event
        </button>
      </div>
    </form>
  </div>
</div>

<form id="delete-event-form" method="POST" action="{{ url_for('admin.delete_event', unit_id=unit.id, event_id=event.id) }}" style="display: none;">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
</form>
{% endblock %}
