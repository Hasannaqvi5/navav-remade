version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: rowapp_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: rowapp
      POSTGRES_PASSWORD: rowapp
      POSTGRES_DB: rowapp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
