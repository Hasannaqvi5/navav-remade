{% extends "base.html" %}
{% block title %}Create Event — {{ unit.name }}{% endblock %}
{% block content %}
<div class="page-container page-narrow">
  <div class="page-header">
    <h1 class="page-title">Create Event</h1>
    <p class="page-subtitle">{{ unit.name }}</p>
  </div>
  <div class="card">
    <form method="POST" action="{{ url_for('admin.create_event', unit_id=unit.id) }}">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
      <div class="form-group">
        <label class="form-label" for="name">Event Name</label>
        <input class="form-input" type="text" id="name" name="name" required placeholder="e.g. Monthly General Meeting" />
      </div>
      <div class="form-row-2">
        <div class="form-group">
          <label class="form-label" for="event_date">Date</label>
          <input class="form-input" type="date" id="event_date" name="event_date" required />
        </div>
        <div class="form-group">
          <label class="form-label">Time <span class="form-hint">(optional)</span></label>
          <div style="display: flex; align-items: center; gap: 0.5rem;">
            <input class="form-input" type="time" id="event_time" name="event_time" title="Start Time" />
            <span>—</span>
            <input class="form-input" type="time" id="event_end_time" name="event_end_time" title="End Time" />
          </div>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label" for="location">Location <span class="form-hint">(optional)</span></label>
        <input class="form-input" type="text" id="location" name="location" placeholder="e.g. Community Center Room A" />
      </div>
      <div class="form-group">
        <label class="form-label" for="description">What's Happening <span class="form-hint">(optional)</span></label>
        <textarea class="form-input form-textarea" id="description" name="description" rows="3" placeholder="e.g. Monthly board meeting followed by committee breakouts."></textarea>
      </div>
      <div class="form-group">
        <label class="form-label" for="response_due_date">Response Due Date &amp; Time <span class="form-hint">(optional)</span></label>
        <input class="form-input" type="datetime-local" id="response_due_date" name="response_due_date" />
      </div>

      <script>
        document.addEventListener('DOMContentLoaded', function() {
          const eventDate = document.getElementById('event_date');
          const eventTime = document.getElementById('event_time');
          const dueInput = document.getElementById('response_due_date');

          function updateMaxDue() {
            if (eventDate.value) {
              const time = eventTime.value || '00:00';
              dueInput.max = `${eventDate.value}T${time}`;
            }
          }

          eventDate.addEventListener('change', updateMaxDue);
          eventTime.addEventListener('change', updateMaxDue);
          updateMaxDue();
        });
      </script>
      <div class="form-actions">
        <button type="submit" class="btn btn-primary">Create Event</button>
        <a href="{{ url_for('admin.events', unit_id=unit.id) }}" class="btn btn-ghost">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
