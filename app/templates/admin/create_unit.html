{% extends "base.html" %}
{% block title %}Create Organization{% endblock %}
{% block content %}
<div class="page-container page-narrow">
  <div class="page-header">
    <h1 class="page-title">Create an Organization</h1>
  </div>
  <div class="card">
    <form method="POST" action="{{ url_for('admin.create_unit') }}">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
      <div class="form-group">
        <label class="form-label" for="name">Organization Name</label>
        <input class="form-input" type="text" id="name" name="name" required placeholder="e.g. Waterloo Region Detachment - STAR" />
      </div>

      <div class="form-actions">
        <button type="submit" class="btn btn-primary">Create New Organization</button>
        <a href="{{ url_for('admin.dashboard') }}" class="btn btn-ghost">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
